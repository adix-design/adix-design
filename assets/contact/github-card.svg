<svg xmlns="http://www.w3.org/2000/svg" width="570" height="140" viewBox="0 0 570 140">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#07080C" />
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="566" height="136" rx="14" fill="url(#card-bg)" stroke="#FF3347" stroke-width="1.2" stroke-opacity="0.5" />
  
  <!-- Corner Accent Ticks -->
  <path d="M 2 30 L 2 14 Q 2 2 14 2 L 30 2" fill="none" stroke="#FF3347" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 540 2 L 556 2 Q 568 2 568 14 L 568 30" fill="none" stroke="#FF3347" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 2 110 L 2 126 Q 2 138 14 138 L 30 138" fill="none" stroke="#FF3347" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 540 138 L 556 138 Q 568 138 568 126 L 568 110" fill="none" stroke="#FF3347" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Icon Container -->
  <rect x="28" y="28" width="84" height="84" rx="12" fill="#050609" stroke="#FF3347" stroke-width="1.2" stroke-opacity="0.6" />
  
  <!-- GitHub Octocat Icon -->
  <g transform="translate(45, 45)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M25 2C12.3 2 2 12.3 2 25C2 35.2 8.6 43.8 17.8 46.8C18.9 47 19.4 46.3 19.4 45.7C19.4 45.2 19.4 43.8 19.4 42C13 43.4 11.6 39 11.6 39C10.6 36.3 9.1 35.6 9.1 35.6C7 34.2 9.3 34.2 9.3 34.2C11.6 34.4 12.8 36.6 12.8 36.6C14.9 40.1 18.2 39.1 19.5 38.5C19.7 37 20.3 36 21 35.4C15.9 34.8 10.5 32.8 10.5 24C10.5 21.5 11.4 19.4 12.8 17.8C12.6 17.2 11.8 14.9 13 11.8C13 11.8 15 11.2 19.4 14.2C21.3 13.7 23.2 13.4 25.1 13.4C27 13.4 28.9 13.7 30.8 14.2C35.2 11.2 37.2 11.8 37.2 11.8C38.4 14.9 37.6 17.2 37.4 17.8C38.9 19.4 39.7 21.5 39.7 24C39.7 32.9 34.3 34.8 29.2 35.4C30.1 36.1 30.8 37.5 30.8 39.7C30.8 42.8 30.8 45.3 30.8 45.7C30.8 46.3 31.3 47 32.4 46.8C41.5 43.8 48.1 35.2 48.1 25C48.1 12.3 37.8 2 25 2Z" fill="#FF3347" filter="url(#glow)"/>
  </g>

  <!-- Card Information -->
  <g transform="translate(136, 0)">
    <text x="0" y="60" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="20" font-weight="900" fill="#F2F2F4" letter-spacing="2">GITHUB</text>
    <text x="0" y="88" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="15" font-weight="500" fill="#858994" letter-spacing="0.5">github.com/adix-design</text>
  </g>

  <!-- Right External Link Icon -->
  <g transform="translate(515, 36)">
    <rect x="0" y="0" width="28" height="28" rx="4" fill="#FF3347" fill-opacity="0.08" stroke="#FF3347" stroke-width="1" stroke-opacity="0.4"/>
    <path d="M 9 19 L 19 9 M 11 9 H 19 V 17" stroke="#FF3347" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  </g>

  <!-- Subtle Right Side Dots -->
  <circle cx="550" cy="65" r="1.5" fill="#FF3347" opacity="0.6"/>
  <circle cx="550" cy="72" r="1.5" fill="#FF3347" opacity="0.8"/>
  <circle cx="550" cy="79" r="1.5" fill="#FF3347" opacity="0.6"/>
</svg>
