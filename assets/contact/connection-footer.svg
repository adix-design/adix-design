<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="85" viewBox="0 0 1200 85">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(600, 15)" text-anchor="middle">
    <!-- Diamond and Line Accent -->
    <line x1="-120" y1="0" x2="-25" y2="0" stroke="#FF3347" stroke-width="1" stroke-opacity="0.4"/>
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#FF3347" filter="url(#glow)"/>
    <line x1="25" y1="0" x2="120" y2="0" stroke="#FF3347" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Confirmation Lines -->
    <text x="0" y="32" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="15" font-weight="800" fill="#FF3347" letter-spacing="2">&gt; CONNECTION READY_</text>
    <text x="0" y="56" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="14" font-weight="500" fill="#F2F2F4" letter-spacing="0.5">Let's build something useful.</text>
  </g>
</svg>
