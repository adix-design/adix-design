<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190">
  <defs>
    <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="header-line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF3347" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FF3347" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF3347" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Section Title -->
  <g transform="translate(10, 10)">
    <!-- Satellite Icon -->
    <g transform="translate(0, 0)">
      <path d="M12 28C12 28 8 24 16 16C24 8 28 12 28 12" stroke="#FF3347" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#red-glow)"/>
      <path d="M6 34C6 34 2 26 14 14C26 2 34 6 34 6" stroke="#FF3347" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M18 22L8 32M6 34L2 38M8 32H2V38" stroke="#FF3347" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20" cy="20" r="2.5" fill="#FF3347"/>
    </g>

    <!-- Header Text -->
    <text x="48" y="26" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="28" font-weight="900" fill="#F2F2F4" letter-spacing="2">CONTACT TERMINAL</text>
    <text x="50" y="48" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="13" font-weight="700" fill="#FF3347" letter-spacing="4">FINAL CONNECTION</text>

    <!-- Top Accent Line -->
    <line x1="0" y1="62" x2="1180" y2="62" stroke="url(#header-line-grad)" stroke-width="1.5" />
    <polygon points="1120,58 1175,58 1165,64 1110,64" fill="#FF3347" opacity="0.8"/>
  </g>

  <!-- Main Terminal Top Container -->
  <g transform="translate(10, 90)">
    <!-- Top HUD Border Frame Piece -->
    <path d="M 0 95 L 0 16 Q 0 0 16 0 L 1164 0 Q 1180 0 1180 16 L 1180 95" fill="#080A0F" stroke="#FF3347" stroke-width="1.2" stroke-opacity="0.6"/>
    
    <!-- Cut-corner Accent Ticks -->
    <path d="M 0 35 L 0 16 Q 0 0 16 0 L 40 0" fill="none" stroke="#FF3347" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1140 0 L 1164 0 Q 1180 0 1180 16 L 1180 35" fill="none" stroke="#FF3347" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left Status: Connection Online -->
    <circle cx="36" cy="32" r="4.5" fill="#FF3347" filter="url(#red-glow)"/>
    <circle cx="36" cy="32" r="2.5" fill="#FFA5A5"/>
    <text x="52" y="37" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="14" font-weight="700" fill="#858994" letter-spacing="1.5">CONNECTION <tspan fill="#45E879" font-weight="800">ONLINE</tspan></text>

    <!-- Right Status: Session ID -->
    <text x="1144" y="37" text-anchor="end" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="14" font-weight="700" fill="#858994" letter-spacing="1">SESSION: <tspan fill="#FF3347" font-weight="800">ARPAN_01</tspan></text>

    <!-- Inner Divider Line -->
    <line x1="20" y1="56" x2="1160" y2="56" stroke="#FF3347" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Command Prompt -->
    <text x="36" y="82" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="15" font-weight="700" fill="#FF3347">&gt; <tspan fill="#FF3347">open_connection</tspan> <tspan fill="#F2F2F4">--arpan</tspan></text>
  </g>
</svg>
