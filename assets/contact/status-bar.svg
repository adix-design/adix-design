<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="75" viewBox="0 0 1200 75">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(10, 0)">
    <!-- Bottom HUD Frame Piece -->
    <path d="M 0 0 L 0 50 Q 0 66 16 66 L 1164 66 Q 1180 66 1180 50 L 1180 0" fill="#080A0F" stroke="#FF3347" stroke-width="1.2" stroke-opacity="0.6"/>
    
    <!-- Cut-corner Accent Ticks -->
    <path d="M 0 35 L 0 50 Q 0 66 16 66 L 40 66" fill="none" stroke="#FF3347" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1140 66 L 1164 66 Q 1180 66 1180 50 L 1180 35" fill="none" stroke="#FF3347" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Top Divider Line -->
    <line x1="20" y1="12" x2="1160" y2="12" stroke="#FF3347" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6,4"/>

    <!-- Left Status Text -->
    <text x="36" y="44" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="15" font-weight="900" fill="#FF3347" letter-spacing="1">
      STATUS <tspan fill="#FF3347">::</tspan> <tspan fill="#45E879" font-weight="800">READY TO BUILD_</tspan>
    </text>

    <!-- Right Scan / Progress Graphic Accent -->
    <g transform="translate(1060, 32)">
      <polygon points="0,12 8,0 16,0 8,12" fill="#FF3347" opacity="0.4"/>
      <polygon points="18,12 26,0 34,0 26,12" fill="#FF3347" opacity="0.6"/>
      <polygon points="36,12 44,0 52,0 44,12" fill="#FF3347" opacity="0.8"/>
      <polygon points="54,12 62,0 70,0 62,12" fill="#FF3347" filter="url(#glow)"/>
      <polygon points="72,12 80,0 88,0 80,12" fill="#FF3347" filter="url(#glow)"/>
    </g>
  </g>
</svg>
