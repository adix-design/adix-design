  <circle cx="482" cy="28" r="7.5" fill="none" stroke="#FF3347" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="496" y="32" fill="#FF3347" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1">ONGOING</text>
  
  <line x1="24" y1="46" x2="556" y2="46" stroke="#FF3347" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Quest Title (23px) -->
