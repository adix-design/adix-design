  <!-- Bottom Metadata Row -->
  <line x1="24" y1="168" x2="556" y2="168" stroke="#FF3347" stroke-width="0.6" stroke-opacity="0.15"/>
  
  <!-- Tag Pill: DESIGN FOCUS -->
  <rect x="24" y="182" width="128" height="26" rx="4" fill="#121620" stroke="#FF3347" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="88" y="199" fill="#F2F2F4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">DESIGN FOCUS</text>

  <!-- Priority -->
  <text x="556" y="200" fill="#858994" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="end">
    PRIORITY: <tspan fill="#F2F2F4" font-weight="700">HIGH</tspan>
  </text>
</g>

