<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
<defs>
  <!-- Main Background Gradient -->
  <linearGradient id="qb-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050609"/>
    <stop offset="50%" stop-color="#080A0F"/>
    <stop offset="100%" stop-color="#0E1118"/>
  </linearGradient>

  <!-- Card Background Gradient -->
  <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0D1017"/>
    <stop offset="100%" stop-color="#07090E"/>
  </linearGradient>

  <!-- Crimson Glow -->
  <filter id="card-glow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#FF3347" flood-opacity="0.3"/>
  </filter>

  <!-- Grid Pattern -->
  <pattern id="card-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FF3347" stroke-width="0.8" stroke-opacity="0.04"/>
  </pattern>
</defs>

<!-- Outer Canvas -->
<rect width="1200" height="460" fill="#050609"/>

<!-- ── CARD 01: AI PRODUCTS (Top-Left: x=24, y=20, w=564, h=198) ──── -->
<g id="quest-01" transform="translate(24, 20)">
  <!-- Card Base with Chamfered Corners -->
  <path d="M 8 0 L 556 0 L 564 8 L 564 190 L 556 198 L 8 198 L 0 190 L 0 8 Z" 
        fill="url(#card-grad)" stroke="#FF3347" stroke-width="1.2" stroke-opacity="0.45" filter="url(#card-glow)"/>
  <path d="M 8 0 L 556 0 L 564 8 L 564 190 L 556 198 L 8 198 L 0 190 L 0 8 Z" fill="url(#card-grid)"/>
  
  <!-- Corner Tech Accents -->
  <path d="M 0 16 L 0 8 L 8 0 L 16 0" fill="none" stroke="#FF3347" stroke-width="2"/>
  <path d="M 548 0 L 556 0 L 564 8 L 564 16" fill="none" stroke="#FF3347" stroke-width="2"/>
  <path d="M 564 182 L 564 190 L 556 198 L 548 198" fill="none" stroke="#FF3347" stroke-width="2"/>
  <path d="M 16 198 L 8 198 L 0 190 L 0 182" fill="none" stroke="#FF3347" stroke-width="2"/>

  <!-- Top Header Row inside Card -->
  <text x="20" y="28" fill="#FF3347" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">QUEST // 01</text>
  
  <!-- Status: ACTIVE -->
  <circle cx="488" cy="24" r="3.5" fill="#45E879"/>
  <circle cx="488" cy="24" r="6.5" fill="none" stroke="#45E879" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="500" y="28" fill="#45E879" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1">ACTIVE</text>
  
  <line x1="20" y1="40" x2="544" y2="40" stroke="#FF3347" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Quest Title -->
  <text x="20" y="72" fill="#F2F2F4" font-family="'JetBrains Mono', Consolas, monospace" font-size="19" font-weight="800" letter-spacing="1">AI PRODUCTS</text>

  <!-- Quest Description -->
  <text x="20" y="102" fill="#9BA1B0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">
    Designing AI-powered products, intelligent interfaces and useful
  </text>
  <text x="20" y="124" fill="#9BA1B0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">
    AI workflows.
  </text>

  <!-- Bottom Metadata Row -->
  <line x1="20" y1="150" x2="544" y2="150" stroke="#FF3347" stroke-width="0.6" stroke-opacity="0.15"/>
  
  <!-- Tag Pill: CORE FOCUS -->
  <rect x="20" y="162" width="104" height="22" rx="3" fill="#121620" stroke="#FF3347" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="72" y="177" fill="#FF3347" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">CORE FOCUS</text>

  <!-- Priority -->
  <text x="544" y="177" fill="#858994" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">
    PRIORITY: <tspan fill="#F2F2F4" font-weight="700">HIGH</tspan>
  </text>
</g>

