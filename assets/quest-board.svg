<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
<defs>
  <!-- Card Background Gradient -->
  <linearGradient id="qb-card-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0E1118"/>
    <stop offset="100%" stop-color="#080A0F"/>
  </linearGradient>

  <!-- Subtle Crimson Glow Filter -->
  <filter id="qb-glow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#FF3347" flood-opacity="0.3"/>
  </filter>

  <!-- Card Grid Pattern -->
  <pattern id="qb-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FF3347" stroke-width="0.8" stroke-opacity="0.035"/>
  </pattern>
</defs>

<!-- Transparent Canvas (NO black background) -->

<!-- ── CARD 01: AI PRODUCTS (Top-Left: x=10, y=10, w=580, h=225) ──── -->
<g id="quest-01" transform="translate(10, 10)">
  <!-- Card Base with Chamfered Corners -->
  <path d="M 10 0 L 570 0 L 580 10 L 580 215 L 570 225 L 10 225 L 0 215 L 0 10 Z" 
        fill="url(#qb-card-bg)" stroke="#FF3347" stroke-width="1.2" stroke-opacity="0.35" filter="url(#qb-glow)"/>
  <path d="M 10 0 L 570 0 L 580 10 L 580 215 L 570 225 L 10 225 L 0 215 L 0 10 Z" fill="url(#qb-grid)"/>
  
  <!-- Corner Tech Accents -->
  <path d="M 0 20 L 0 10 L 10 0 L 20 0" fill="none" stroke="#FF3347" stroke-width="2"/>
  <path d="M 560 0 L 570 0 L 580 10 L 580 20" fill="none" stroke="#FF3347" stroke-width="2"/>
  <path d="M 580 205 L 580 215 L 570 225 L 560 225" fill="none" stroke="#FF3347" stroke-width="2"/>
  <path d="M 20 225 L 10 225 L 0 215 L 0 205" fill="none" stroke="#FF3347" stroke-width="2"/>

  <!-- Top Header Row inside Card -->
  <text x="24" y="32" fill="#FF3347" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" letter-spacing="1.5">QUEST // 01</text>
  
  <!-- Status: ACTIVE -->
  <circle cx="494" cy="28" r="4" fill="#45E879"/>
  <circle cx="494" cy="28" r="7.5" fill="none" stroke="#45E879" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="508" y="32" fill="#45E879" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1">ACTIVE</text>
  
  <line x1="24" y1="46" x2="556" y2="46" stroke="#FF3347" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Quest Title (23px) -->
  <text x="24" y="82" fill="#F2F2F4" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" letter-spacing="0.5">AI PRODUCTS</text>

  <!-- Quest Description (17px) -->
  <text x="24" y="116" fill="#9A9DA6" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="400">
    Designing AI-powered products, intelligent interfaces and
  </text>
  <text x="24" y="140" fill="#9A9DA6" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="400">
    useful AI workflows.
  </text>

  <!-- Bottom Metadata Row -->
  <line x1="24" y1="168" x2="556" y2="168" stroke="#FF3347" stroke-width="0.6" stroke-opacity="0.15"/>
  
  <!-- Tag Pill: CORE FOCUS -->
  <rect x="24" y="182" width="112" height="26" rx="4" fill="#121620" stroke="#FF3347" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="80" y="199" fill="#FF3347" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">CORE FOCUS</text>

  <!-- Priority -->
  <text x="556" y="200" fill="#858994" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="end">
    PRIORITY: <tspan fill="#F2F2F4" font-weight="700">HIGH</tspan>
  </text>
</g>

