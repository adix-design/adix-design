  <circle cx="476" cy="24" r="3.5" fill="#FF3347"/>
  <circle cx="476" cy="24" r="6.5" fill="none" stroke="#FF3347" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="488" y="28" fill="#FF3347" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1">ONGOING</text>
  
  <line x1="20" y1="40" x2="544" y2="40" stroke="#FF3347" stroke-width="0.8" stroke-opacity="0.2"/>

