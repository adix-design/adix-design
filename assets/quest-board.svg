  <rect x="20" y="162" width="116" height="22" rx="3" fill="#121620" stroke="#FF3347" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="78" y="177" fill="#F2F2F4" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">DESIGN FOCUS</text>

  <!-- Priority -->
  <text x="544" y="177" fill="#858994" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">
    PRIORITY: <tspan fill="#F2F2F4" font-weight="700">HIGH</tspan>
  </text>
</g>

