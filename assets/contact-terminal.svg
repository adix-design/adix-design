      <path d="M20 6C12.27 6 6 12.27 6 20C6 26.18 10.02 31.42 15.58 33.27C16.28 33.4 16.54 32.97 16.54 32.6C16.54 32.27 16.53 31.4 16.52 30.24C12.63 31.08 11.81 28.37 11.81 28.37C11.17 26.75 10.25 26.32 10.25 26.32C8.98 25.45 10.35 25.47 10.35 25.47C11.75 25.57 12.49 26.91 12.49 26.91C13.74 29.05 15.77 28.43 16.57 28.07C16.7 27.16 17.06 26.54 17.46 26.19C14.35 25.84 11.08 24.64 11.08 19.27C11.08 17.74 11.63 16.49 12.53 15.51C12.38 15.16 11.9 13.73 12.67 11.79C12.67 11.79 13.85 11.41 16.54 13.23C17.66 12.92 18.86 12.77 20.06 12.76C21.26 12.77 22.46 12.92 23.58 13.23C26.27 11.41 27.44 11.79 27.44 11.79C28.22 13.73 27.74 15.16 27.59 15.51C28.49 16.49 29.03 17.74 29.03 19.27C29.03 24.65 25.75 25.83 22.63 26.18C23.13 26.61 23.58 27.47 23.58 28.78C23.58 30.66 23.56 32.18 23.56 32.6C23.56 32.97 23.82 33.41 24.53 33.27C30.08 31.41 34.1 26.18 34.1 20C34.1 12.27 27.83 6 20 6Z" fill="#ff3347"/>
