<!-- Panel Footer Status -->
<g font-family="monospace">
  <line x1="30" y1="292" x2="970" y2="292" stroke="#ff3347" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="40" y="322" font-size="13" font-weight="bold" fill="#9fa0a7">STATUS <tspan fill="#ff3347">::</tspan> <tspan fill="#ff5264">READY TO BUILD_</tspan></text>
</g>

<!-- Bottom Outside Connection Lines -->
<g font-family="monospace" text-anchor="middle">
  <polygon points="500,368 505,373 500,378 495,373" fill="#ff3347"/>
  <text x="500" y="398" font-size="14" font-weight="bold" fill="#ff5264">&gt; connection ready_</text>
  <text x="500" y="418" font-size="13" fill="#ffffff">Let's build something useful.</text>
</g>

</svg>
