      <path d="M6 12L20 22L34 12" stroke="#ff3347" stroke-width="1.8" stroke-linejoin="round" fill="none"/>
    </g>
    <text x="590" y="142" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="1">EMAIL</text>
    <text x="590" y="163" font-size="12" fill="#9fa0a7">contact@arpanstudio.dev</text>
    <!-- Arrow Icon -->
    <path d="M 925 135 L 937 147 M 937 135 V 147 H 925" stroke="#ff5264" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </a>

  <!-- Card 3: LINKEDIN -->
  <a href="https://www.linkedin.com/in/arpan-deep-dubey/" target="_blank">
    <rect x="40" y="198" width="445" height="72" rx="10" fill="#0b0d12" stroke="#ff3347" stroke-width="1" stroke-opacity="0.4"/>
    <!-- LinkedIn Icon -->
