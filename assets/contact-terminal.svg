<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07080b"/>
    <stop offset="50%" stop-color="#0f090d"/>
    <stop offset="100%" stop-color="#14080c"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2.5" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>

<!-- Outer Main Panel -->
<rect x="10" y="10" width="980" height="340" rx="16" fill="url(#bg)" stroke="#ff3347" stroke-width="1.2" stroke-opacity="0.6"/>

<!-- Panel Top Header Bar -->
<g font-family="monospace">
  <circle cx="35" cy="38" r="4" fill="#ff3347" filter="url(#glow)"/>
  <text x="48" y="42" font-size="13" font-weight="bold" fill="#ffffff">CONNECTION <tspan fill="#ff5264">ONLINE</tspan></text>
  
  <text x="945" y="42" font-size="13" text-anchor="end" fill="#9fa0a7">SESSION ID: <tspan fill="#ffffff">ARPAN_01</tspan> &nbsp;|&nbsp; <tspan fill="#ff3347">📶</tspan></text>
  <line x1="30" y1="58" x2="970" y2="58" stroke="#ff3347" stroke-opacity="0.25" stroke-width="1"/>
</g>

<!-- Command Prompt Line -->
<g font-family="monospace">
  <text x="40" y="90" font-size="15" font-weight="bold" fill="#ff3347">&gt; <tspan fill="#ffffff">open_connection</tspan> <tspan fill="#888888">--arpan</tspan></text>
</g>

<!-- 4 Contact Cards Grid -->
<g font-family="monospace">
  <!-- Card 1: PORTFOLIO -->
  <a href="https://arpanstudio.dev" target="_blank">
    <rect x="40" y="110" width="445" height="72" rx="10" fill="#0b0d12" stroke="#ff3347" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Globe Icon -->
    <g transform="translate(60, 126)">
      <circle cx="20" cy="20" r="14" stroke="#ff3347" stroke-width="1.8" fill="none"/>
      <ellipse cx="20" cy="20" rx="6" ry="14" stroke="#ff3347" stroke-width="1.5" fill="none"/>
      <line x1="6" y1="20" x2="34" y2="20" stroke="#ff3347" stroke-width="1.5"/>
    </g>
    <text x="115" y="142" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="1">PORTFOLIO</text>
    <text x="115" y="163" font-size="12" fill="#9fa0a7">arpanstudio.dev</text>
    <!-- Arrow Icon -->
    <path d="M 450 135 L 462 147 M 462 135 V 147 H 450" stroke="#ff5264" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </a>

  <!-- Card 2: EMAIL -->
