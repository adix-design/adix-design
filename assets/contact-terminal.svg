      <rect x="6" y="6" width="28" height="28" rx="4" stroke="#ff3347" stroke-width="1.8" fill="none"/>
      <text x="14" y="27" font-size="16" font-weight="bold" fill="#ff3347">in</text>
    </g>
    <text x="115" y="230" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="1">LINKEDIN</text>
    <text x="115" y="251" font-size="12" fill="#9fa0a7">linkedin.com/in/arpan-deep-dubey</text>
    <!-- Arrow Icon -->
    <path d="M 450 223 L 462 235 M 462 223 V 235 H 450" stroke="#ff5264" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </a>

