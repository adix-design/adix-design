    <text x="0" y="218" fill="#9296A0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" text-anchor="middle">Engineering</text>
    <text x="0" y="244" fill="#858994" font-family="'JetBrains Mono', monospace" font-size="10.5" text-anchor="middle">ACADEMIC CORE</text>
