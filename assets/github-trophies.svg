    <text x="0" y="156" fill="#F2F2F4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Full-Stack Apps</text>
    <text x="0" y="178" fill="#F2F2F4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">MERN &amp; MODERN WEB</text>
    <text x="0" y="200" fill="#9296A0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" text-anchor="middle">Built complete web apps,</text>
    <text x="0" y="218" fill="#9296A0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" text-anchor="middle">APIs &amp; Ed-Tech platform</text>
    <text x="0" y="244" fill="#858994" font-family="'JetBrains Mono', monospace" font-size="10.5" text-anchor="middle">DEVELOPMENT</text>
  </g>

