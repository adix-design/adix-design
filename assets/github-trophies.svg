<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
<defs>
  <!-- Background Gradients -->
  <linearGradient id="journey-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#11141E"/>
    <stop offset="50%" stop-color="#090B10"/>
    <stop offset="100%" stop-color="#050609"/>
  </linearGradient>

  <linearGradient id="panel-subtle-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0E1118"/>
    <stop offset="100%" stop-color="#080A0E"/>
  </linearGradient>

  <!-- Glow Filter -->
  <filter id="achieve-glow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#FF3347" flood-opacity="0.3"/>
  </filter>

  <filter id="green-glow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#45E879" flood-opacity="0.4"/>
  </filter>

  <!-- Grid Pattern -->
  <pattern id="achieve-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FF3347" stroke-width="0.8" stroke-opacity="0.035"/>
  </pattern>
</defs>

<!-- Transparent Background -->

<!-- ── 1. MAIN TIMELINE CONTAINER (1180 x 310) ──────────────────── -->
<g id="journey-timeline" transform="translate(10, 10)">
  <!-- Container Card with Low-Intensity Border -->
  <path d="M 14 0 L 1166 0 L 1180 14 L 1180 296 L 1166 310 L 14 310 L 0 296 L 0 14 Z" fill="url(#journey-bg)" stroke="#8B1022" stroke-width="1" filter="url(#achieve-glow)"/>
  <path d="M 14 0 L 1166 0 L 1180 14 L 1180 296 L 1166 310 L 14 310 L 0 296 L 0 14 Z" fill="url(#achieve-grid)"/>

