<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 515" width="1200" height="515">
<defs>
  <!-- Card Gradients -->
  <linearGradient id="feature-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#111520"/>
    <stop offset="60%" stop-color="#0B0D14"/>
    <stop offset="100%" stop-color="#08090E"/>
  </linearGradient>

  <linearGradient id="card-subtle-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0D1017"/>
    <stop offset="100%" stop-color="#08090E"/>
  </linearGradient>

  <!-- Feature Glow -->
  <filter id="feature-glow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FF3347" flood-opacity="0.35"/>
  </filter>

  <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#FF3347" flood-opacity="0.2"/>
  </filter>
</defs>

<!-- Transparent Canvas -->

<!-- ── TIER 1: LARGE FEATURE CARD — AI PRODUCTS (1180 x 175) ──── -->
<g id="feature-ai" transform="translate(10, 10)">
  <!-- Card Base -->
  <rect width="1180" height="175" rx="8" fill="url(#feature-bg)" stroke="#FF3347" stroke-width="1.2" stroke-opacity="0.38" filter="url(#feature-glow)"/>
  
  <!-- Subtle Top-Left Accent Notch -->
  <path d="M 0 24 L 0 8 Q 0 0 8 0 L 24 0" fill="none" stroke="#FF3347" stroke-width="2"/>
  <line x1="8" y1="0" x2="120" y2="0" stroke="#FF3347" stroke-width="2"/>

  <!-- Icon + Title Header Row -->
  <g transform="translate(32, 28)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF3347" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
</svg>
  </g>
  <text x="68" y="47" fill="#F2F2F4" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">AI PRODUCTS</text>
  
  <!-- Pill on Right: CORE FOCUS -->
  <rect x="1046" y="28" width="102" height="26" rx="4" fill="#181B26" stroke="#FF3347" stroke-width="1" stroke-opacity="0.6"/>
  <text x="1097" y="45" fill="#FF3347" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="1">CORE FOCUS</text>

  <!-- Description (17.5px) -->
  <text x="32" y="88" fill="#9DA1AF" font-family="system-ui, -apple-system, sans-serif" font-size="17.5" font-weight="400">
    Designing AI-powered products, intelligent interfaces and practical AI workflows.
  </text>

  <!-- Bottom Divider Line -->
  <line x1="32" y1="122" x2="1148" y2="122" stroke="#FF3347" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- Metadata Tag -->
  <text x="32" y="148" fill="#858994" font-family="'JetBrains Mono', monospace" font-size="12.5" letter-spacing="1">
    TAGS // <tspan fill="#F2F2F4" font-weight="600">AI • PRODUCT • INTELLIGENCE</tspan>
  </text>
  <text x="1148" y="148" fill="#858994" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="end">
    CAPABILITY // 01
  </text>
</g>

<!-- ── TIER 2: TWO SIDE-BY-SIDE CARDS (580 x 175 each) ────────── -->
<!-- Left Side Card: WEB EXPERIENCES -->
<g id="card-web" transform="translate(10, 200)">
  <rect width="580" height="175" rx="8" fill="url(#card-subtle-bg)" stroke="#FF3347" stroke-width="1" stroke-opacity="0.28" filter="url(#subtle-glow)"/>
  
  <g transform="translate(28, 24)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF3347" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10"/>
  <line x1="2" y1="12" x2="22" y2="12"/>
  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
</svg>
  </g>
  <text x="58" y="41" fill="#F2F2F4" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">WEB EXPERIENCES</text>

  <!-- Description (16px) -->
  <text x="28" y="78" fill="#9DA1AF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
    Creating modern, responsive and polished websites
  </text>
  <text x="28" y="102" fill="#9DA1AF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
    and full-stack digital experiences.
  </text>

  <line x1="28" y1="126" x2="552" y2="126" stroke="#FF3347" stroke-width="0.6" stroke-opacity="0.15"/>

  <text x="28" y="150" fill="#858994" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">
    TAGS // <tspan fill="#F2F2F4" font-weight="600">WEB • UX • INTERACTION</tspan>
  </text>
</g>

<!-- Right Side Card: PRODUCT DESIGN -->
<g id="card-design" transform="translate(610, 200)">
  <rect width="580" height="175" rx="8" fill="url(#card-subtle-bg)" stroke="#FF3347" stroke-width="1" stroke-opacity="0.28" filter="url(#subtle-glow)"/>
  
  <g transform="translate(28, 24)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF3347" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 19l7-7 3 3-7 7-3-3z"/>
  <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
  <path d="M2 2l7.586 7.586"/>
  <circle cx="11" cy="11" r="2"/>
</svg>
  </g>
  <text x="58" y="41" fill="#F2F2F4" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">PRODUCT DESIGN</text>

  <!-- Description (16px) -->
  <text x="28" y="78" fill="#9DA1AF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
    Design-first thinking, interface systems and polished
  </text>
  <text x="28" y="102" fill="#9DA1AF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
    experiences that make products easier to use.
  </text>

  <line x1="28" y1="126" x2="552" y2="126" stroke="#FF3347" stroke-width="0.6" stroke-opacity="0.15"/>

  <text x="28" y="150" fill="#858994" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">
    TAGS // <tspan fill="#F2F2F4" font-weight="600">UI • UX • SYSTEMS</tspan>
  </text>
</g>

<!-- ── TIER 3: WIDE HORIZONTAL CARD — AI AUTOMATION (1180 x 115) ─ -->
<g id="card-automation" transform="translate(10, 390)">
  <rect width="1180" height="115" rx="8" fill="url(#card-subtle-bg)" stroke="#FF3347" stroke-width="1" stroke-opacity="0.28" filter="url(#subtle-glow)"/>
  
  <g transform="translate(32, 24)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF3347" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2" y="3" width="6" height="6" rx="1"/>
  <rect x="16" y="3" width="6" height="6" rx="1"/>
  <rect x="9" y="15" width="6" height="6" rx="1"/>
  <path d="M5 9v3a2 2 0 0 0 2 2h5M19 9v3a2 2 0 0 1-2 2h-5"/>
</svg>
  </g>
  <text x="64" y="41" fill="#F2F2F4" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">AI AUTOMATION</text>

  <!-- Horizontal description layout -->
  <text x="32" y="76" fill="#9DA1AF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
    Connecting AI, APIs and workflows to automate repetitive tasks and improve real-world processes.
  </text>

  <text x="1148" y="41" fill="#858994" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1" text-anchor="end">
    TAGS // <tspan fill="#F2F2F4" font-weight="600">AI • APIs • WORKFLOWS</tspan>
  </text>
</g>

</svg>